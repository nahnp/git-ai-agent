[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-ai-agent"
version = "0.1.0"
description = "Auditable local Git review and approval workflows for CLI and MCP."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = ["pydantic>=2.8,<3", "PyYAML>=6,<7", "typer>=0.12,<1", "rich>=13,<15", "mcp>=1.0,<2"]

[project.optional-dependencies]
dev = ["build>=1.2", "mypy>=1.11", "pytest>=8", "pytest-cov>=5", "ruff>=0.6", "types-PyYAML>=6"]

[project.scripts]
git-ai-agent = "git_ai_agent.cli.app:app"
git-ai-agent-mcp = "git_ai_agent.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/git_ai_agent"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["git_ai_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["git_ai_agent"]
